ll="#0f172a" text-anchor="start">shilling transferred</text><circle cx="390" cy="226" r="26" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="390" y="236" font-size="30" fill="#b45309" text-anchor="middle" font-weight="700">?</text><text x="390" y="268" font-size="16" fill="#b45309" text-anchor="middle" font-weight="700">defined</text><text x="390" y="287" font-size="16" fill="#b45309" text-anchor="middle" font-weight="700">differently</text><text x="830" y="22" font-size="20" fill="#166534" text-anchor="start" font-weight="700">Evidence that travelled</text><rect x="830" y="40" width="340" height="372" rx="10" fill="#ffffff" stroke="#166534" stroke-width="2"/><rect x="830" y="40" width="340" height="52" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="2"/><text x="844" y="64" font-size="19" fill="#0f172a" text-anchor="start" font-weight="700">Bedoya et al., Afghanistan</text><text x="844" y="85.0" font-size="16.5" fill="#334155" text-anchor="start" font-style="italic">graduation programme</text><text x="844" y="116" font-size="16" fill="#64748b" text-anchor="start" font-weight="700">PROGRAMME PACKAGE</text><rect x="844" y="126" width="150" height="32" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="919" y="148" font-size="17" fill="#0f172a" text-anchor="middle">Livestock asset</text><rect x="1004" y="126" width="150" height="32" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="1079" y="148" font-size="17" fill="#0f172a" text-anchor="middle">Cash stipend</text><rect x="844" y="166" width="150" height="32" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="919" y="188" font-size="17" fill="#0f172a" text-anchor="middle">Skills training</text><rect x="1004" y="166" width="150" height="32" rx="8" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="1079" y="188" font-size="17" fill="#0f172a" text-anchor="middle">Coaching</text><rect x="854" y="226" width="292" height="54" rx="10" fill="#f1f5f