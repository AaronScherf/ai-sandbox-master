<svg font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 1170 376" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1e3a8a"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b45309"/></marker></defs><rect x="0" y="115" width="120" height="70" rx="10" fill="#1e3a8a" stroke="none" stroke-width="2"/><text x="60" y="146" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">A design</text><text x="60" y="168" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">decision</text><rect x="150" y="115" width="210" height="70" rx="10" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/><text x="255" y="155" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="700">Room to choose?</text><rect x="400" y="115" width="210" height="70" rx="10" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/><text x="505" y="144" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="700">Real uncertainty</text><text x="505" y="166" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="700">about the best option?</text><rect x="650" y="115" width="210" height="70" rx="10" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/><text x="755" y="144" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="700">Relevant evidence</text><text x="755" y="166" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="700">exists?</text><line x1="120" y1="150" x2="148" y2="150" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#ah)"/><line x1="360" y1="150" x2="398" y2="150" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#ah)"/><line x1="610" y1="150" x2="648" y2="150" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#ah)"/><text x="134" y="140" font-size="16" fill="#166534" text-anchor="middle" font-weight="700">yes</text><text x="379" y="140" font-size="16" fill="#166534" text-anchor="middle" font-weight="700">yes</text><text x="629" y="140" font-size="16" fill="#166534" text-anchor="middle" font-weight="700">yes</text><line x1="255" y1="185" x2="255" y2="238" stroke="#64748b" stroke-width="2.5" marker-end="url(#ahg)"/><text x="267" y="218" font-size="16" fill="#9f1239" text-anchor="start" font-weight="700">no</text><rect x="150" y="240" width="210" height="62" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="255" y="266" font-size="17" fill="#0f172a" text-anchor="middle">Out of scope:</text><text x="255" y="287" font-size="17" fill="#0f172a" text-anchor="middle">no choice to inform</text><line x1="505" y1="185" x2="505" y2="238" stroke="#64748b" stroke-width="2.5" marker-end="url(#ahg)"/><text x="517" y="218" font-size="16" fill="#9f1239" text-anchor="start" font-weight="700">no</text><rect x="400" y="240" width="210" height="62" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="505" y="266" font-size="17" fill="#0f172a" text-anchor="middle">No evidence needed:</text><text x="505" y="287" font-size="17" fill="#0f172a" text-anchor="middle">best option is clear</text><path d="M860 150 H890 V48 H918" fill="none" stroke="#166534" stroke-width="2.5" marker-end="url(#ah)"/><rect x="920" y="10" width="250" height="76" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="2"/><text x="1045" y="42" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="700">Use it</text><text x="1045" y="66" font-size="17" fill="#334155" text-anchor="middle">relevant and usable</text><path d="M860 150 H890 V150 H918" fill="none" stroke="#b45309" stroke-width="2.5" marker-end="url(#ah)"/><rect x="920" y="112" width="250" height="76" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="1045" y="144" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="700">Gap: transport it</text><text x="1045" y="168" font-size="17" fill="#334155" text-anchor="middle">exists, but too distant</text><path d="M860 150 H890 V252 H918" fill="none" stroke="#9f1239" stroke-width="2.5" marker-end="url(#ah)"/><rect x="920" y="214" width="250" height="76" rx="10" fill="#ffe4e6" stroke="#9f1239" stroke-width="2"/><text x="1045" y="246" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="700">Gap: generate or substitute</text><text x="1045" y="270" font-size="17" fill="#334155" text-anchor="middle">no relevant evidence</text><rect x="0" y="330" width="1170" height="40" rx="8" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-dasharray="8 5"/><text x="585" y="357" font-size="18" fill="#1e3a8a" text-anchor="middle" font-weight="600">Research target: the share of decisions ending in each outcome, by sector and decision type</text></svg>
