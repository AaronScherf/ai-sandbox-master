<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 1170 336" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1e3a8a"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b45309"/></marker></defs><text x="0" y="20" font-size="19" fill="#1e3a8a" text-anchor="start" font-weight="700">Asked of every decision</text><rect x="0" y="32" width="275" height="70" rx="10" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/><text x="137" y="62" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="700">Discretion left?</text><text x="137" y="86.0" font-size="16.5" fill="#334155" text-anchor="middle">after rules and budget</text><rect x="295" y="32" width="275" height="70" rx="10" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/><text x="432" y="62" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="700">Existing information</text><text x="432" y="86.0" font-size="16.5" fill="#334155" text-anchor="middle">can it separate the options?</text><rect x="590" y="32" width="275" height="70" rx="10" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/><text x="727" y="62" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="700">Timeline</text><text x="727" y="86.0" font-size="16.5" fill="#334155" text-anchor="middle">does it allow more evidence?</text><rect x="885" y="32" width="275" height="70" rx="10" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/><text x="1022" y="62" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="700">Cost of being wrong</text><text x="1022" y="86.0" font-size="16.5" fill="#334155" text-anchor="middle">who bears it; reversible?</text><rect x="0" y="140" width="540" height="190" rx="10" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/><text x="14" y="170" font-size="20" fill="#0f172a" text-anchor="start" font-weight="700">First: desk audit</text><text x="14" y="194" font-size="17" fill="#334155" text-anchor="start">documents only, no human subjects</text><rect x="14" y="210" width="240" height="34" rx="8" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/><text x="134" y="233" font-size="17" fill="#0f172a" text-anchor="middle">Decisions made</text><rect x="270" y="210" width="240" height="34" rx="8" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/><text x="390" y="233" font-size="17" fill="#0f172a" text-anchor="middle">Constraints</text><rect x="14" y="252" width="240" height="34" rx="8" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/><text x="134" y="275" font-size="17" fill="#0f172a" text-anchor="middle">Evidence used</text><rect x="270" y="252" width="240" height="34" rx="8" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/><text x="390" y="275" font-size="17" fill="#0f172a" text-anchor="middle">Outcomes</text><text x="14" y="316.0" font-size="16.5" fill="#334155" text-anchor="start" font-style="italic">Also: did decision-makers seek outside support?</text><line x1="544" y1="235" x2="636" y2="235" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#ah)"/><text x="590" y="225" font-size="17" fill="#1e3a8a" text-anchor="middle" font-weight="600">then</text><rect x="640" y="140" width="530" height="190" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="654" y="170" font-size="20" fill="#0f172a" text-anchor="start" font-weight="700">Later: partner funnel</text><text x="654" y="194" font-size="17" fill="#334155" text-anchor="start" font-style="italic">refusals are data</text><rect x="660.0" y="208" width="490" height="25" rx="5" fill="#1e3a8a" stroke="none" stroke-width="2"/><text x="905" y="227.0" font-size="16.5" fill="#fff" text-anchor="middle" font-weight="600">Approached</text><rect x="705.0" y="237" width="400" height="25" rx="5" fill="#3b5bb5" stroke="none" stroke-width="2"/><text x="905" y="256.0" font-size="16.5" fill="#fff" text-anchor="middle" font-weight="600">Responded</text><rect x="750.0" y="266" width="310" height="25" rx="5" fill="#6b83c9" stroke="none" stroke-width="2"/><text x="905" y="285.0" font-size="16.5" fill="#fff" text-anchor="middle" font-weight="600">Accepted</text><rect x="795.0" y="295" width="220" height="25" rx="5" fill="#9eb0dd" stroke="none" stroke-width="2"/><text x="905" y="314.0" font-size="16.5" fill="#0f172a" text-anchor="middle" font-weight="600">Fit</text></svg>
