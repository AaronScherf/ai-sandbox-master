<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 1170 410" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1e3a8a"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b45309"/></marker></defs><text x="370.0" y="28" font-size="18" fill="#1e3a8a" text-anchor="middle" font-weight="700">Find and describe what is known</text><text x="940.0" y="28" font-size="18" fill="#1e3a8a" text-anchor="middle" font-weight="700">Test what can be used here</text><text x="0" y="96" font-size="18" fill="#1e3a8a" text-anchor="start" font-weight="700">Evidence</text><text x="0" y="118" font-size="18" fill="#1e3a8a" text-anchor="start" font-weight="700">from studies</text><text x="0" y="280" font-size="18" fill="#1e3a8a" text-anchor="start" font-weight="700">Local,</text><text x="0" y="302" font-size="18" fill="#1e3a8a" text-anchor="start" font-weight="700">replicable data</text><text x="0" y="324" font-size="18" fill="#1e3a8a" text-anchor="start" font-weight="700">and results</text><rect x="170" y="44" width="400" height="130" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="2.5"/><text x="184" y="72.0" font-size="18.5" fill="#0f172a" text-anchor="start" font-weight="700">Literature discovery and extraction</text><text x="184" y="98" font-size="17" fill="#334155" text-anchor="start">Automated search; extracts study facts</text><text x="184" y="119" font-size="17" fill="#334155" text-anchor="start">and causal claims</text><rect x="184" y="138" width="168" height="28" rx="14" fill="#bbf7d0" stroke="#166534" stroke-width="1.5"/><text x="268.0" y="158.0" font-size="16.5" fill="#0f172a" text-anchor="middle" font-weight="700">Built and piloted</text><rect x="740" y="44" width="400" height="130" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="754" y="72.0" font-size="18.5" fill="#0f172a" text-anchor="start" font-weight="700">Evidence gap map</text><text x="754" y="98" font-size="17" fill="#334155" text-anchor="start">Follows the 3ie model, extended with</text><text x="754" y="119" font-size="17" fill="#334155" text-anchor="start">shock, crisis phase, delivery</text><rect x="754" y="138" width="99" height="28" rx="14" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/><text x="803.5" y="158.0" font-size="16.5" fill="#0f172a" text-anchor="middle" font-weight="700">In design</text><rect x="170" y="244" width="400" height="130" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="2.5"/><text x="184" y="272.0" font-size="18.5" fill="#0f172a" text-anchor="start" font-weight="700">Context data panel</text><text x="184" y="298" font-size="17" fill="#334155" text-anchor="start">Conflict, rainfall, prices, displacement</text><text x="184" y="319" font-size="17" fill="#334155" text-anchor="start">from open APIs; new country by config</text><rect x="184" y="338" width="228" height="28" rx="14" fill="#bbf7d0" stroke="#166534" stroke-width="1.5"/><text x="298.0" y="358.0" font-size="16.5" fill="#0f172a" text-anchor="middle" font-weight="700">Built: Somalia and Sudan</text><rect x="740" y="244" width="400" height="130" rx="10" fill="#dcfce7" stroke="#166534" stroke-width="2.5"/><text x="754" y="272.0" font-size="18.5" fill="#0f172a" text-anchor="start" font-weight="700">Reproducible replications</text><text x="754" y="298" font-size="17" fill="#334155" text-anchor="start">reprokit; Bangladesh insurance study</text><text x="754" y="319" font-size="17" fill="#334155" text-anchor="start">nearly complete, Egger and HSNP next</text><rect x="754" y="338" width="159" height="28" rx="14" fill="#bbf7d0" stroke="#166534" stroke-width="1.5"/><text x="833.5" y="358.0" font-size="16.5" fill="#0f172a" text-anchor="middle" font-weight="700">Released; in use</text><line x1="734" y1="109.0" x2="578" y2="109.0" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#ah)"/><text x="655" y="99.0" font-size="17" fill="#1e3a8a" text-anchor="middle" font-weight="600">directs the search</text><line x1="578" y1="309.0" x2="734" y2="309.0" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#ah)"/><text x="655" y="299.0" font-size="17" fill="#1e3a8a" text-anchor="middle" font-weight="600">measures closeness</text><line x1="370.0" y1="178" x2="370.0" y2="238" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#ah)"/><text x="384.0" y="214" font-size="17" fill="#1e3a8a" text-anchor="start" font-weight="600">makes comparable records</text><line x1="940.0" y1="240" x2="940.0" y2="180" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#ah)"/><text x="926.0" y="214" font-size="17" fill="#1e3a8a" text-anchor="end" font-weight="600">shows which estimates reproduce</text><rect x="170" y="384" width="14" height="14" rx="3" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="192" y="397.0" font-size="16.5" fill="#334155" text-anchor="start">Built</text><rect x="262" y="384" width="14" height="14" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="284" y="397.0" font-size="16.5" fill="#334155" text-anchor="start">In design</text><text x="1140" y="397.0" font-size="16.5" fill="#1e3a8a" text-anchor="end" font-style="italic">Each pass narrows the next</text></svg>
