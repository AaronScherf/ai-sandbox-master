# guide_specs/econometrics/wald_lm_lr_tests.toml
# New material: the baseline recipe plus class_2024 notes/slides/recitations (pinned files) and
# previously unused textbook sections (discover rules, reviewed before use). Same prompt and
# draft model as the baseline so run B1 isolates the new material; heading-prefix label matching.

[guide]
id = "wald_lm_lr_new_material"
title = "Wald, Lagrange Multiplier, and Likelihood Ratio Tests"
course = "econometrics"

[models]
draft = "gemini-3.1-flash-lite"
enhance = "gemini-3.8-flash"

[draft]
prompt = "tutor_v1"
label_match = "heading-prefix"
top_k = 180
file_top_k = 80

[[note]]
heading = "Source-reference discrepancy"
body = "The course syllabus points to Hansen §§9.9, 9.11, and 9.16 for these tests. In the converted Hansen chapter, the headings identify §9.9 as *t*-ratios and the abuse of testing, §9.10 as Wald tests, §9.11 as homoskedastic Wald tests, §9.16 as Hausman tests, and §9.17 as score tests. Chapter 9 contains no section headed likelihood ratio test (Hansen section 5.13, \"Likelihood Ratio Test\", is included below as additional material)."

[[topic]]
title = "Cameron & Trivedi Section 7.2: Wald test"
instruction = "Explain the Wald test: hypotheses, unrestricted estimation, statistic and covariance, asymptotic distribution, decision rule, examples, and invariance cautions."

  [[topic.source]]
  kind = "section"
  book = "Cameron_Microeconometrics"
  labels = ["7.2"]
  exclude_labels = []
  query = "Wald test linear nonlinear hypotheses covariance chi-square invariance"
  max = 12

  [[topic.source]]
  kind = "file"
  file = "class_2024/Class Notes/Slides/processed_outputs/slidesASYM.md"
  query = "Wald test statistic homoskedastic covariance chi-square"
  max = 6

  [[topic.source]]
  kind = "file"
  file = "class_2024/Recitations/processed_outputs/Recitation 5.md"
  query = "Wald test of nonlinear hypothesis delta method"
  max = 6

  [[topic.source]]
  kind = "discover"
  query = "Wald test statistic, linear and nonlinear restrictions, covariance estimator"
  doc_types = ["textbook"]
  exclude_guide = "academic_notes/econometrics/summaries/previous/wald_lm_lr_tests.md"
  max = 8
  min_score = 0.72
  max_per_file = 4

