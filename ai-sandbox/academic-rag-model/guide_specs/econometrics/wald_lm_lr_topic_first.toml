# guide_specs/econometrics/wald_lm_lr_topic_first.toml
# Topic-first Wald / LM / LR guide. Topics are concepts, not textbook sections: every topic pulls
# from every book that covers it plus the class material, and the prompt compares what each source
# says inside the topic. Contrast with wald_lm_lr_tests*.toml, whose topic lists copy the book
# sections (the cause of the textbook-split guides in runs B0/B1/B2/E1).
#
# Differences from wald_lm_lr_tests_new_material.toml:
#   - topics named by concept; section rules for Hansen, Cameron and (via discover) Hayashi side by side
#   - exam-oriented class sources pinned: TA notes 07/08, professor notes, 2026 lecture notes and their
#     question-resolver sidecars, the 2024 midterm key and problem-set solutions
#   - discover rules keep more: min_score 0.70, max 30, and no exclude_guide (previously used passages
#     are wanted here, not treated as already covered)
#   - draft model gemini-3.8-flash (flash-lite ignored the word floor in run a2) and prompt guide_v1 with an 1800-word floor per section (tutor_v1, used by the baseline runs, gives
#     short question-and-answer style text); citations are stripped from the body and listed per section
#     in the frontmatter (`topic_sources`), as the enhance stage reads `indexer_source_refs`, not the text
#   - construct_examples = true on the Wald, LR, LM, recipes and worked-problems topics: where the sources
#     give a formula but no numbers, the draft works a constructed numerical example, labelled
#     "Constructed example (not from the sources)" so the enhance stage can check it
#   - three stand-in topics (recipes, worked problems, formula reference) until guide-profile sections
#     exist; they reuse the same sources and show what the draft engine can already do
#
# Deferred (come back to these): a per-topic character budget replacing the per-rule `max` counts,
# a `min_chars` floor to drop heading-only fragments, and `[[derived]]` sections (recipes, worked
# problems, formula reference) built from the finished topic text instead of raw sources.
#
# Planned input, not yet implemented: tutoring-session transcripts.
#   A guided tutoring agent for the RAG is being built separately. It will write transcripts of the
#   student's dialogue while working practice problems drawn from this same indexed content. Those
#   transcripts matter for guides in two ways: they elaborate the example problems step by step, and
#   they record where the student needed extra help (confusions, mistaken steps, repeated hints).
#   Study guides should use them to (a) expand the worked-problem topics with the elaborations and
#   (b) add emphasis or extra explanation where the student struggled.
#   No code change should be needed to consume them: once transcripts are chunked and indexed (give them
#   their own doc_type, e.g. "tutoring_transcript"), pin one with a `kind = "file"` rule or add a
#   `kind = "discover"` rule with doc_types = ["tutoring_transcript"] to the worked-problem and
#   recipe topics, and to any topic the transcripts show to be weak. Add the rule under that topic's
#   [[topic.source]] list when the transcripts exist. Keep student-specific details out of this spec:
#   the transcripts stay in the vault, never in the repo.

[guide]
id = "wald_lm_lr_topic_first"
title = "Wald, Lagrange Multiplier, and Likelihood Ratio Tests"
course = "econometrics"

[models]
draft = "gemini-3.8-flash"
enhance = "gemini-3.8-flash"

[draft]
prompt = "guide_v1"
min_words = 1800
citations = "strip"
label_match = "heading-prefix"
top_k = 180
file_top_k = 80

[[note]]
heading = "Source-reference discrepancy"
body = "The course syllabus points to Hansen §§9.9, 9.11, and 9.16 for these tests. In the converted Hansen chapter, the headings identify §9.9 as *t*-ratios and the abuse of testing, §9.10 as Wald tests, §9.11 as homoskedastic Wald tests, §9.12 as criterion-based tests, §9.16 as Hausman tests, and §9.17 as score tests. Chapter 9 has no section headed likelihood ratio test; Hansen section 5.13, \"Likelihood Ratio Test\", is included as additional material."

# ---------------------------------------------------------------------------------------------------
[[topic]]
title = "The testing trinity: what Wald, LR and LM each measure"
instruction = "Build the framework that the other topics rely on: the null and alternative, the restricted and unrestricted estimators, and the likelihood picture in which the Wald test measures distance between the estimates, the likelihood ratio test measures the drop in the log-likelihood, and the score test measures the slope of the log-likelihood at the restricted estimate. State each statistic and its asymptotic distribution, and say which estimates each test needs. Where textbooks and class notes frame this differently, say so inside this topic and explain the difference."

  [[topic.source]]
  kind = "section"
  book = "Hansen_ECONOMETRICS"
  labels = ["9.12", "9.17", "5.13"]
  exclude_labels = []
  query = "criterion-based tests score test likelihood ratio restricted unrestricted statistic"
  max = 12

  [[topic.source]]
