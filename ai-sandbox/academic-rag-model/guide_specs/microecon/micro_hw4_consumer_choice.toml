# 6. Luce, monotonicity, consideration sets
[[topic]]
title = "The Luce model, monotonicity and the consideration-set model"
instruction = "Cover the Luce model of random choice and its defining axiom (independence of irrelevant alternatives in the ratio form), the regularity or monotonicity property (the probability of choosing an option cannot rise when alternatives are added), and what each model implies. Then the random consideration-set model of Homework 4 question 1: a default alternative, a consideration probability for each alternative, choice of the best considered option, the resulting choice probability formula and why it follows, whether it satisfies monotonicity and the Luce axiom, the two axioms (I-asymmetry and I-independence) and what they say, and how the model speaks to choice overload. Teach how to derive and test each property; do not write out the final answers to the homework parts."

