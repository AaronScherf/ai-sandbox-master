# 2. Primer: constrained optimisation
[[topic]]
title = "Solving the consumer's problem: Lagrangians, Kuhn-Tucker conditions and corner solutions"
instruction = "Teach the optimisation tools needed to derive demand, for a reader who has not used them before. Cover: the consumer's problem as maximising utility subject to the budget constraint; why the budget binds under monotone preferences; the Lagrangian and the first-order conditions; the tangency condition (marginal rate of substitution equals the price ratio) and its interpretation; why tangency fails at corners and kinks, and how the Kuhn-Tucker conditions handle inequality constraints; the interpretation of the multiplier. Work a complete derivation for an interior case and a separate worked derivation for a corner case, checking each solution against the budget. State which utility functions need the corner treatment."
construct_examples = true

