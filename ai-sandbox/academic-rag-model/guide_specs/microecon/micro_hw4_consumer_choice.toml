# guide_specs/microecon/micro_hw4_consumer_choice.toml
# Study guide for GR6211 Microeconomic Analysis I (Mark Dean), built around Homework 4 and the lectures up to
# Consumer Choice 1: random utility and choice, then consumer choice and demand.
#
# Topic selection (confirmed by the owner 2026-10-09): taken from the lecture slides and problem sets first, the
# textbooks second. Two background primer sections come first because the professor assumes a micro background the
# owner does not have (demand-curve vocabulary, marginal rate of substitution, constrained optimisation).
# Section 10 (expenditure minimisation, Hicksian demand, Slutsky) goes beyond the lectures given so far because
# Homework 4 question 3 depends on it; its instruction says so.
#
# Textbook section rules use chapter numbers as labels (the converted Press headings read like 2.D, which the label
# parser sees as chapter 2); the rule's query and max pick the relevant passages inside the chapter.
#
# Sourced from hand-converted and TA material too: Homework 2 and 3 (with the owner's own solutions) and the TA
# solutions to Homeworks 1 to 3. Not yet in the index: the HW3/HW4 hints and guided solutions (no source PDF, so the
# indexer cannot see them) and the 29 Sep and 1 Oct lecture canvases (not transcribed).
#
# Revise: the [revise] table below is part of the spec hash, so it is written now to keep the plan valid for the
# later revise pass. Out-of-scope material is producer theory, risk, games and equilibrium.

[guide]
id = "micro_hw4_consumer_choice"
title = "Microeconomic Analysis I: Random Choice through Consumer Demand (Homework 4 Study Guide)"
course = "microecon"

[models]
draft = "gemini-3.8-flash"
enhance = "gemini-3.8-flash"

[draft]
prompt = "guide_v1"
min_words = 1200
citations = "strip"
label_match = "heading-prefix"
top_k = 180
file_top_k = 80

[[note]]
heading = "How to use this guide"
body = "Sections 1 and 2 are a primer on the microeconomics the course assumes: the vocabulary of demand and the optimisation tools used to derive it. Sections 3 to 7 follow the first lectures (preference and utility, random choice, and where rational choice fails). Sections 8 to 11 cover consumer choice and demand, which is the content of Homework 4 questions 2 to 4. Section 10 goes beyond the lectures given so far because Homework 4 question 3 needs it."

# ---------------------------------------------------------------------------------------------------
# 1. Primer: demand vocabulary and the marginal rate of substitution
[[topic]]
title = "Micro toolkit: bundles, budget sets, the marginal rate of substitution and kinds of demand"
instruction = "Write a primer for a reader with no undergraduate microeconomics. Define from first principles: a commodity bundle, price taking, the budget set and budget line, an indifference curve, the marginal rate of substitution (as the slope of an indifference curve and in terms of marginal utilities), diminishing marginal rate of substitution, and why indifference curves cannot cross. Then explain the kinds of demand: the demand curve itself and movement along it versus a shift of it, ordinary (Marshallian, in this course Walrasian) demand versus compensated (Hicksian) demand, normal, inferior and Giffen goods, substitutes and complements, the income and the substitution effect, and price, income and cross-price elasticities. Say in plain words what each object means before using notation, and flag the terms the lecture slides use without defining. Work at least two small numerical examples."
construct_examples = true

