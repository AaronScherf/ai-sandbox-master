<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project steering review</title>
<style>body{font:16px system-ui;max-width:1200px;margin:2rem auto;padding:0 1rem;background:#f8f7f2;color:#202820}section{background:white;margin:1rem 0;padding:1rem;border:1px solid #ccc;border-radius:8px}article{border-top:1px solid #ddd;padding:.75rem 0}label{display:inline-block;margin:.3rem}button{margin:.3rem;padding:.35rem .7rem}small{color:#555}input,select{font:inherit}#error{color:#a00}.batch-controls{display:flex;align-items:center;flex-wrap:wrap;gap:.35rem}.table-scroll{max-height:70vh;overflow:auto;border:1px solid #ddd}.scored-table{width:100%;min-width:1050px;border-collapse:collapse;font-size:.875rem}.scored-table th,.scored-table td{border-bottom:1px solid #ddd;padding:.3rem .45rem;text-align:left;vertical-align:middle}.scored-table th{position:sticky;top:0;background:#edf0e8;z-index:1}.scored-table tbody tr:not(.detail-row):hover{background:#f5f7f1}.scored-table td:nth-child(2){max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.scored-table td:nth-child(3){max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.scored-table select{max-width:92px;font-size:.875rem}.scored-table .task-expand{border:0;background:none;color:#165880;text-decoration:underline;cursor:pointer;padding:0;margin:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;font-size:inherit}.scored-table .table-actions{white-space:nowrap}.scored-table .table-actions button{margin:.1rem;padding:.25rem .35rem;font-size:.8rem}.scored-table .detail-row td{background:#fafaf7;padding:.7rem}.scored-table .detail-row article{border:0}.scored-table tr[hidden]{display:none}</style>
<style>.table-filters{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin:.25rem 0 .6rem}.table-filters[hidden]{display:none}.table-filters input[type=search]{min-width:230px}.table-filters input[type=number]{width:130px}.sort-header{border:0;background:none;font:inherit;font-weight:600;text-align:left;cursor:pointer;padding:0;margin:0;color:inherit;text-decoration:underline;text-underline-offset:3px}.scored-table th[aria-sort=ascending] .sort-header::after{content:' ↑'}.scored-table th[aria-sort=descending] .sort-header::after{content:' ↓'}</style>
