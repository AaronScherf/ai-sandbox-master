vocabulary: data_source
version: 4
provenance: provisional
source: Starter list written for this project; replace or reconcile when an authoritative
  list is adopted.
terms:
- id: data_source.household_survey
  label: Household survey
- id: data_source.panel_survey
  label: Panel survey
- id: data_source.administrative_records
  label: Administrative records
  definition: Records an agency keeps about individuals, households or transactions
    while running a programme or service (registries, beneficiary lists, tax or health-facility
    records).
- id: data_source.government_statistics
  label: Government statistics
  definition: Published aggregate figures from an official agency, such as county,
    district or national totals, accounts and price indices, rather than the underlying
    records.
- id: data_source.census
  label: Census
- id: data_source.remote_sensing
  label: Remote sensing or satellite data
- id: data_source.market_price_data
  label: Market price data
- id: data_source.early_warning_data
  label: Early-warning or food-security monitoring data
- id: data_source.conflict_event_data
  label: Conflict event data
- id: data_source.weather_climate_data
  label: Weather or climate data
- id: data_source.mobile_phone_data
  label: Mobile phone or digital trace data
- id: data_source.experimental_primary_data
  label: Primary data collected for the trial
- id: data_source.interviews_fieldwork
  label: Interviews or fieldwork
- id: data_source.programme_documents_evaluation_reports
  label: Programme documents and evaluation reports
  source: local
  definition: Non-academic project documents, evaluation reports, policy briefs and
    funding agency records synthesized in literature reviews.
- id: data_source.peer_reviewed_literature
  label: Peer-reviewed literature
  source: local
  definition: Published academic articles, scientific journals and peer-reviewed studies
    synthesized as the evidence base in systematic reviews.
